name: "SpecGuard Audit"
description: "Audita la trazabilidad entre specs de Kiro y el codigo de un pull request"
branding:
  icon: "shield"
  color: "purple"
inputs:
  spec-dir:
    description: "Directorio del spec de Kiro"
    required: true
  base-ref:
    description: "Rama base contra la que comparar"
    required: false
    default: "origin/main"
  fail-under:
    description: "Score minimo de trazabilidad para pasar"
    required: false
    default: "0"
runs:
  using: "composite"
  steps:
    - name: Install SpecGuard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "$ACTION_PATH"
    - name: Run audit
      shell: bash
      env:
        SPEC_DIR: ${{ inputs.spec-dir }}
        BASE_REF: ${{ inputs.base-ref }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        git fetch origin "${GITHUB_BASE_REF:-main}" --depth=50 || true
        specguard audit \
          --spec "$SPEC_DIR" \
          --diff "${BASE_REF}...HEAD" \
          --output reports \
          --fail-under "$FAIL_UNDER"
