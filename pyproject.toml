[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specguard"
version = "0.1.0"
description = "Auditoria de trazabilidad entre specs de Kiro y el codigo que dice implementarlas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SpecGuard Team" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
semantic = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.4", "hypothesis==6.161.2"]

[project.scripts]
specguard = "specguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
