name: SpecGuard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Audit traceability
        run: |
          specguard audit \
            --spec .kiro/specs/specguard-core \
            --diff "origin/${{ github.base_ref }}...HEAD" \
            --output reports || true
      - name: Comment PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/report.md
